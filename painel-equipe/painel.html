<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Painel da Equipe Euforia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: mesmo "app de estúdio" do Portal do Cliente (barra lateral + área de trabalho), mas a tela inicial é uma fila única ordenada pela regra de ouro, com um botão de próximo passo por card. */
/* Identidade Grupo Euforia, versão white igual ao portal: tema único, sempre claro. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F4F1; --line:#E6E3DE;
  --ink:#141414; --muted:#5E5A54; --accent:#FF5A00; --accent-text:#C24100; --accent-soft:#FFE6D6; --on-accent:#FFFFFF;
  --grad:linear-gradient(90deg,#FF7A1A,#FF4D00);
  --ok:#1F7A4F; --ok-soft:#DDF0E6; --warn:#9A6200; --warn-soft:#FAEED5; --info:#2F55C0; --info-soft:#E2E8F8; --bad:#B42318; --bad-soft:#FDE4E1;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Inter','Segoe UI',Arial,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-weight:800;text-transform:uppercase;font-size:clamp(26px,3vw,34px)}
h2{font-size:20px}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.02em}
.proto{background:var(--ink);color:var(--bg);font-size:13px;text-align:center;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;gap:24px;padding-block:24px;padding-right:16px;padding-left:max(16px,env(safe-area-inset-left,0px))}
.brand img{width:130px;height:auto;display:block}
.brand small{display:block;margin-top:6px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px 12px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600}
.badge{background:var(--grad);color:var(--on-accent);border-radius:99px;font-size:12px;font-weight:700;padding:1px 8px;min-width:22px;text-align:center}
.who{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:13px}
.who label{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.who select{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}

main{min-width:0;padding-block:32px 64px;padding-left:max(16px,min(40px,4vw));padding-right:max(16px,env(safe-area-inset-right,0px),min(40px,4vw))}
.view{display:flex;flex-direction:column;gap:24px;max-width:1120px}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.sub{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-display);font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat.hot{border-color:var(--bad);background:var(--bad-soft)}
.stat.hot .v{color:var(--bad)}
.stat span{color:var(--muted);font-size:13px}

.group{display:flex;flex-direction:column;gap:8px}
.group h2{display:flex;align-items:center;gap:8px}
.group h2 .count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 0;background:var(--surface)}
.item .stripe{align-self:stretch;border-radius:0 4px 4px 0;background:var(--line)}
.item.late .stripe{background:var(--bad)}
.item.today .stripe{background:var(--accent)}
.item.adj .stripe{background:var(--warn)}
.item .main{min-width:0;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:none;border:0;text-align:left;padding:0}
.item .t{font-weight:600;line-height:1.3}
.item .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.item .act{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.red{background:var(--bad-soft);color:var(--bad)}
.chip.org{background:var(--accent-soft);color:var(--accent-text)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.info{background:var(--info-soft);color:var(--info)}
.empty{color:var(--muted);font-size:14px;padding:12px 2px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;white-space:nowrap}
a.btn{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--grad);border-color:transparent;color:var(--on-accent)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:var(--warn-soft);border-color:var(--warn-soft);color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.panel{border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.note{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--muted)}
.note b{color:var(--ink)}

/* Carga */
.load{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.load li{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:12px;align-items:center}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok)}
.bar span.mid{background:var(--warn)}
.bar span.hi{background:var(--bad)}
.load .n{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

.passar{border:1px solid var(--line);border-radius:12px;padding:12px 14px}.passar summary{cursor:pointer;font-weight:600}
.resp{display:flex;gap:8px;align-items:flex-end;margin-top:8px}.resp textarea{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;background:var(--surface);color:inherit;resize:vertical}
@media (max-width:600px){.resp{flex-direction:column;align-items:stretch}}
.anexos{display:flex;flex-direction:column;gap:10px}.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.alist li{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;min-width:0}.alist li>span{min-width:0;overflow-wrap:anywhere}
/* Máquinas */
.machines{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mach{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.mach .v{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1}

/* Clientes */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:640px}
th,td{text-align:left;padding:10px 8px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:13px;font-weight:600;border-top:0}
.sw{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid var(--line);vertical-align:middle}

/* Formulário */
form{display:flex;flex-direction:column;gap:14px}
label{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:6px}
textarea,input[type=text],input[type=url],input[type=date],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.modo{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modo legend{font-weight:600;font-size:14px;padding:0 4px}
.opt{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;border-radius:9px;padding:8px;cursor:pointer}
.opt:has(input:checked){background:var(--accent-soft)}
.opt:has(input:disabled){opacity:.5;cursor:not-allowed}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt span{display:flex;flex-direction:column;gap:2px}
.opt small{color:var(--muted);font-size:13px}
/* Gaveta */
.scrim{position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(20,20,20,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-in{overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:18px}
.dl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;font-size:14px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.steps{display:flex;flex-wrap:wrap;gap:4px;list-style:none;margin:0;padding:0}
.steps li{font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.steps li.done{background:var(--ok-soft);color:var(--ok)}
.steps li.now{background:var(--grad);color:#fff}
.drop{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.falta{display:flex;flex-direction:column;gap:4px;border-radius:12px;padding:12px 14px;background:var(--bad-soft);color:var(--bad);font-size:14px}.falta span{color:var(--ink)}
.drop.has{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.hist li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px}
.hist .mono{color:var(--muted);padding-top:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.close{align-self:flex-end;background:none;border:0;font-size:14px;color:var(--muted);text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px;border-right:0;border-bottom:1px solid var(--line);padding-block:12px;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand small{display:none}
  .nav{flex-direction:row;overflow-x:auto;width:100%;gap:4px;padding-bottom:4px}
  .nav button{width:auto;white-space:nowrap;flex:none}
  .who{margin-top:0;width:100%;flex-direction:row;align-items:center}
  .who label{white-space:nowrap}
  .stats{grid-template-columns:1fr 1fr}
  .two,.grid2,.modo{grid-template-columns:1fr}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .item{grid-template-columns:6px minmax(0,1fr)}
  .item .act{grid-column:2;padding-bottom:2px}
  .load li{grid-template-columns:90px minmax(0,1fr) 80px}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}

/* Grade de postagem */
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filtros label{min-width:180px;flex:1 1 180px;max-width:280px}
.semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.semana .col{border:1px solid var(--line);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--surface)}
.semana .col.hoje{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.semana .col h3{font-size:14px;margin:0 2px 2px;display:flex;justify-content:space-between;gap:6px}
.semana .col h3 .mono{color:var(--muted);font-weight:500}
.slot{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:8px;padding:7px 8px;background:var(--surface);font-size:13px;min-width:0;width:100%}
.slot b{font-size:13px;line-height:1.25;overflow-wrap:anywhere}
.slot .sub{font-size:12px}
.slot.YouTube{border-left-color:#E5281A}
.slot.TikTok{border-left-color:#141414}
.slot.Instagram{border-left-color:#C13584}
.slot.Blog{border-left-color:var(--info)}
.slot.pausado{opacity:.5;border-style:dashed}
.slot.confirmar{background:var(--warn-soft)}
button.slot:hover{border-color:var(--muted)}
.legenda{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (max-width:860px){.semana{grid-template-columns:minmax(0,1fr)}.semana .col.vazio{display:none}.filtros label{max-width:none}}
/* Página real: login por PIN, telas de espera e barra de envio. */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gate-box{width:min(380px,100%);display:flex;flex-direction:column;gap:18px;text-align:center;align-items:center}
.gate-box img{width:150px;height:auto}
.gate-box form{width:100%}
.pin{font-family:var(--f-mono);font-size:28px;letter-spacing:.5em;text-align:center;width:100%;border:1px solid var(--line);border-radius:12px;padding:12px}
.err{color:var(--bad);font-size:14px;min-height:21px}
.who .user{display:flex;align-items:center;gap:10px}
.who .user b{display:block;line-height:1.2}
.who .user small{color:var(--muted);font-size:12px}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:13px;align-self:flex-start}
.up{display:flex;flex-direction:column;gap:6px}
.up .bar{height:8px}
.up .bar span{background:var(--accent);transition:width .2s}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.cl-prog{display:flex;flex-direction:column;gap:4px;min-width:130px}
.cart{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.cart .ccard{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cart .ccard.red{border-color:var(--bad)}
.cart .ccard h3{margin:0;font-size:16px;line-height:1.25}
.cart .linha{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.cart .linha .bar{height:8px}
.cart details summary{cursor:pointer;font-size:13px;color:var(--muted)}
.cart details ul{margin:6px 0 0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.cl-prog .bar{height:6px}
.drawer section{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.drawer section .bar,.cl-tipo .bar{flex:none;height:10px;display:block}
.cl-ent{display:flex;gap:6px;flex-wrap:wrap}
.cl-ent .chip{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.cl-tipo{display:grid;grid-template-columns:90px minmax(0,1fr) 150px;gap:10px;align-items:center;font-size:14px}
.cl-tipo .n{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--muted)}
.cl-links{display:flex;gap:8px;flex-wrap:wrap}
.mini-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.mini-l li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.obs{white-space:pre-wrap;font-size:14px;background:var(--surface-2);border-radius:10px;padding:12px 14px;margin:0}
.refresh{font-size:13px;color:var(--muted)}
@media (max-width:860px){.who .linkbtn{margin-left:auto;align-self:center}}
/* Diretoria: visão geral, quadro por pessoa, tabela de cards e mensagens da equipe. */
.stats.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
.board .col{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2);min-width:0}
.board .col h3{font-size:18px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.board .col h3 small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted)}
.mini{display:flex;flex-direction:column;gap:5px;text-align:left;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);width:100%;font-size:13px;min-width:0}
.mini:hover{border-color:var(--muted)}
.mini.late{border-left-color:var(--bad)}.mini.today{border-left-color:var(--accent)}.mini.adj{border-left-color:var(--warn)}
.mini b{font-size:13.5px;line-height:1.3;overflow-wrap:anywhere}
.mini .meta{display:flex;flex-wrap:wrap;gap:4px}
.mini .chip{font-size:11px;padding:1px 7px}
.load button{all:unset;cursor:pointer;font-weight:600}
.view .load li{grid-template-columns:110px minmax(0,1fr) 150px}
.load button:hover{text-decoration:underline}
.load .n b{color:var(--bad)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td .sub{font-size:13px}
.msgs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.msgs li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.msgs .quem{display:flex;flex-direction:column;gap:2px;font-size:13px}
.msgs .quem b{font-size:14px}
.msgs .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.ativ{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.ativ li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px}
.ativ .mono{color:var(--muted);padding-top:2px}
.ativ button{all:unset;cursor:pointer}
.ativ button:hover b{text-decoration:underline}
.pessoas{display:flex;flex-wrap:wrap;gap:8px}
.pessoas label{flex-direction:row;align-items:center;gap:6px;font-weight:500;border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer}
.pessoas label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.pessoas input{accent-color:var(--accent)}

 {id:'call',g:'Estratégia e calls',nome:'Apresentação de call (estratégia, onboarding)',maq:'Máquina do Escritório',le:'Dossiê, ficha do cliente e entregas feitas.',volta:'Deck com roteiro nas notas, aviso ao Rômulo.',link:'Tipo e data da call',ex:'Call 2 de estratégia, quinta 10h.',mao:'Google Slides'},

 {id:'funil',g:'Página e Instagram',nome:'Funil',maq:'Máquina do Escritório',le:'Oferta e público do cliente.',volta:'Desenho do funil e textos.',link:'Oferta',ex:'Funil do produto de entrada.',mao:'Outro'},
 {id:'insta',g:'Página e Instagram',nome:'Insta-Blindado (bio, destaques, fixados)',maq:'Máquina do Escritório',le:'Perfil atual, identidade e oferta.',volta:'Bio, capas de destaque e posts fixados.',link:'@ do Instagram',ex:'Bio nova. O cliente mandou o texto no grupo dia 24.',mao:'Canva'},
 {id:'copy',g:'Página e Instagram',nome:'Copy',maq:'Máquina do Escritório',le:'Oferta e tom do cliente.',volta:'Texto no corpo do card.',link:'Onde vai a copy',ex:'Legenda do lançamento.',mao:'Notion'},
 {id:'outro',g:'Outro',nome:'Outro pedido',maq:'Máquina do Escritório',le:'O que você escrever aqui.',volta:'Depende do pedido.',link:'Link (opcional)',ex:'Descreva o que precisa.',mao:'Outro'}
];
// Erros que a pessoa consegue resolver sozinha; o resto vira o aviso padrão.
const MOTIVO = {acesso:'Seu acesso mudou. Entre de novo com o PIN.', permissao:'Esse card não está no seu nome.', etapa:'Esse card mudou de etapa. A fila foi atualizada.',
  link:'Cole o link antes de mandar.', texto:'Escreva o que precisa antes de mandar.', prazo:'Escolha um prazo de hoje em diante.', cliente:'Escolha um cliente ativo.',
  tema:'Escreva o tema ou o texto da thumb.', pessoa:'Esse card já está com essa pessoa. Escolha outra.', fim:'Escolha o que aconteceu.', pego:'Alguém pegou esse card antes. A fila foi atualizada.', limite:'Você já está com 8 cards em produção. Termine um para pegar outro.', direcao:'Esse assunto é da diretoria. Não responda por aqui.', grupo:'Esse grupo não é de cliente do suporte.', whatsapp:'O WhatsApp não mandou. Tente de novo ou responda direto no grupo.', tamanho:'Arquivo vazio ou maior que 20 GB.', 'sem-pasta':'A pasta do cliente no Drive não foi achada. Cole o link do arquivo no lugar.'};
const ERRO = 'Deu erro, a diretoria está resolvendo.';
const LIMITE = 8;
let PANEXOS = [];
function listaAnexos(){ const l = $('#palist'); if (l) l.innerHTML = PANEXOS.map((f, i) => `<li><span>📎 ${esc(f.name)} <span class="mono">${(f.size / 1048576).toFixed(1)} MB</span></span><button type="button" class="btn" data-tiraanexo="${i}">Tirar</button></li>`).join(''); }
function juntarAnexos(lista){ for (const f of lista) if (PANEXOS.length < 10 && f.size > 0) PANEXOS.push(f); if (lista.length && PANEXOS.length >= 10) toast('Até 10 arquivos por pedido.'); listaAnexos(); }
const PASSAR = [['victor', 'Victor'], ['lorena', 'Lorena'], ['daniel', 'Daniel'], ['escritorio', 'Escritório (máquinas)']];

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D = null, R = null, W = null, WQR = '', PIN = '', view = '', ocupado = false;
let G = null, GC = '', GP = '';
const RASC = {};
let MP = null, MPQ = '', CC = null;
let CE = null, CEQ = '', CEF = '';
let CL = null, CLQ = '', CLF = '', CLO = 'atencao';
let DD = null, MM = null, PF = 'abertos', PQ = '', TQ = '', TS = '', TP = '', TT = '', MQ = '', MW = '';
try { PIN = localStorage.getItem(KEY) || ''; view = localStorage.getItem('painel-view') || ''; } catch (e) {}
if (DEMO) PIN = '0000';

function toast(t){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 3600); }
function tela(id){ ['tela-pin','tela-aviso','tela-carregando','app'].forEach(x => document.getElementById(x).hidden = x !== id); }

async function api(path, body){
  if (DEMO) return demoApi(path, body);
  const r = await fetch(BASE + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ u: U, pin: PIN }, body || {})) });
  return r.json();
}

// Datas chegam como AAAA-MM-DD; a conta é sempre em dias inteiros contra o "hoje" do servidor.
const dia = s => { if (!s) return null; const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const diff = s => { const a = dia(s), h = dia(D.hoje); return a ? Math.round((a - h) / 864e5) : 999; };
const fmt = s => { const a = dia(s); return a ? a.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' }).replace('.', '') : '—'; };
const cli = c => (D.clientes.find(x => x.id === c.cliente)) || { faixa: '', atencao: false };
const papel = () => D.papel;
const revisor = () => papel() === 'revisor' || papel() === 'teste' || papel() === 'diretor';
const diretor = () => papel() === 'diretor';
const posta = () => revisor() || papel() === 'calls';
const ABERTO = ['A fazer', 'Fazendo', 'Ajustes'];

async function carregar(silencioso){
  if (!U) { tela('tela-aviso'); return; }
  if (!PIN) { tela('tela-pin'); setTimeout(() => $('#pin').focus(), 50); return; }
  if (!silencioso && !D) tela('tela-carregando');
  try {
    const d = await api('euforia-painel-fila');
    if (!d || !d.ok) {
      try { localStorage.removeItem(KEY); } catch (e) {}
      PIN = ''; D = null; tela('tela-pin'); $('#pin-err').textContent = 'PIN errado ou acesso desligado.'; $('#pin').value = ''; $('#pin').focus(); return;
    }
    D = d; render(); tela('app');
    if (VIEWS.responder.pode()) { carregarRespostas(); if (!W && !diretor()) carregarWhats(); }
    if (VIEWS.calls.pode() && !CC) carregarCalls();
    if (diretor()) carregarDiretor();
  } catch (e) {
    if (!D) { tela('tela-aviso'); $('#aviso-t').textContent = 'Não abriu agora'; $('#aviso-p').textContent = 'Confira a internet e tente de novo em alguns minutos. Se continuar, avise a diretoria.'; }
  }
}

// Regra de ouro: ajustes primeiro, depois o que vai ao ar antes, faixa A antes de B e C, depois o prazo.
function ordenar(a){ return a.sort((x, y) => (y.status === 'Ajustes') - (x.status === 'Ajustes') || diff(x.postar) - diff(y.postar) || String(cli(x).faixa || 'Z').localeCompare(String(cli(y).faixa || 'Z')) || diff(x.prazo) - diff(y.prazo)); }
// A Máquina do Escritório devolve o pedido a quem pediu com "🏢 Escritório IA = Falta informação" e escreve na Obs o que falta.
const falta = c => c.meu && c.escritorio === 'Falta informação' && ['A fazer', 'Fazendo', 'Ajustes'].includes(c.status);
function oQueFalta(c){ const l = String(c.obs || '').split('\n').find(x => /Falta informação:/.test(x)); return l ? l.replace(/^.*Falta informação:\s*/, '') : 'Veja as observações do card.'; }
let CANEXOS = [];
function classe(c){ const k = diff(c.prazo); if (falta(c)) return 'late'; if (c.status === 'Ajustes') return 'adj'; if (ABERTO.includes(c.status) && k < 0) return 'late'; if (ABERTO.includes(c.status) && k === 0) return 'today'; return ''; }

  const cl = cli(c), k = diff(c.prazo); let h = '';

function proximo(c){
  if (falta(c)) return { label: 'Completar pedido', cls: 'primary' };

// Visão geral do diretor: calls de hoje e amanhã com a apresentação de cada uma, apresentações que ainda não ficaram prontas e pedidos parados por falta de informação.
const ehApresCall = c => /APRESENTAÇÃO DE CALL/i.test(c.titulo || c.nome || '');
const apresPronta = c => !!c.link && !ABERTO.includes(c.status);
function apresDaCall(k){
  const l = DD.cards.filter(c => ehApresCall(c) && c.status !== 'Cancelado');
  const nome = String(k.cliente || '').toLowerCase().split(' ')[0];
  return l.find(c => k.id && String(c.obs || '').includes(k.id)) || l.find(c => nome && /\(agenda\)/i.test(c.titulo || c.nome || '') && String(c.clienteNome || '').toLowerCase().includes(nome) && dd(c.prazo) >= -1);
}
function hojeDiretor(){
  const calls = CC && !CC.erro ? CC.calls.filter(k => { const d = Math.round((dia(k.dia) - dia(CC.hoje)) / 864e5); return (d === 0 && k.fimHora > CC.agora) || d === 1; }) : [];
  const pend = DD.cards.filter(c => ehApresCall(c) && !apresPronta(c) && !['Cancelado', 'Postado'].includes(c.status)).sort((a, b) => dd(a.prazo) - dd(b.prazo));
  const falta = (D.pedidos || []).filter(p => situacao(p).g === 'falta');

    return apresPronta(a) ? `<a class="chip ok" style="text-decoration:none" href="${esc(a.link)}" target="_blank" rel="noopener">Abrir apresentação</a>` : `<button class="chip warn" style="border:0;cursor:pointer" data-dcard="${a.id}">Apresentação ${a.status === 'Ajustes' ? 'em ajuste' : 'em produção'}</button>`; };

      <span class="t">${k.dia === CC.hoje ? 'Hoje' : 'Amanhã'} ${esc(k.hora)} · ${esc(k.cliente)}</span>
      <span class="meta">${k.agora ? '<span class="chip red">Acontecendo agora</span>' : ''}${k.tipo ? `<span class="chip">${esc(k.tipo)}</span>` : ''}${chipApres(k)}</span></div>
    <span class="act">${k.meet ? `<a class="btn ${k.agora ? 'primary' : ''}" style="text-decoration:none" href="${esc(k.meet)}" target="_blank" rel="noopener">Meet</a>` : ''}</span></li>`;
  const linhaPend = c => `<li class="item ${dd(c.prazo) < 0 ? 'late' : dd(c.prazo) === 0 ? 'today' : ''}"><span class="stripe"></span><button class="main" data-dcard="${c.id}">
      <span class="t">${esc(c.clienteNome)} · ${esc(c.nome)}</span>
      <span class="meta"><span class="chip">${esc(c.status)}</span>${c.prazo ? `<span class="chip ${dd(c.prazo) < 0 ? 'red' : ''}">Prazo ${fmt(c.prazo)}</span>` : ''}${c.escritorio ? `<span class="chip">${esc(c.escritorio)}</span>` : ''}</span></button></li>`;
  const linhaFalta = p => `<li class="item late"><span class="stripe"></span><button class="main" data-dcard="${p.id}">
      <span class="t">${esc(p.clienteNome)} · ${esc(p.nome)}</span>
      <span class="meta"><span class="chip">por ${esc(p.por)}</span><span class="chip">Pedido ${esc(p.quando)}</span></span>
      ${p.falta ? `<span class="sub" style="font-size:13px;color:var(--bad)">Falta: ${esc(p.falta)}</span>` : ''}</button></li>`;
  const semApres = calls.filter(k => !apresDaCall(k) && !k.apresentacao).length;
  return `<div class="hoje3" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start;margin-bottom:16px">

      ${!CC ? '<p class="sub">Carregando a agenda…</p>' : CC.erro ? '<p class="empty">Não consegui ler a agenda agora.</p>' : calls.length ? `${semApres ? `<p class="sub" style="font-size:13px;color:var(--bad)">${semApres} sem apresentação ainda.</p>` : ''}<ul class="rows">${calls.map(linhaCall).join('')}</ul>` : '<p class="empty">Nenhuma call hoje nem amanhã.</p>'}

// Etapa do pedido do ponto de vista de quem pediu.
function situacao(p){
  const aberto = ['A fazer', 'Fazendo', 'Ajustes'].includes(p.status);
  if (p.status === 'Cancelado') return { g: 'cancelado', t: 'Cancelado', c: '' };
  if (p.escritorio === 'Falta informação' && aberto) return { g: 'falta', t: 'Falta informação', c: 'red' };
  if (['Postado', 'Aprovado', 'Agendado'].includes(p.status)) return { g: 'pronto', t: p.status === 'Postado' ? 'Pronto · postado' : 'Pronto · aprovado', c: 'ok' };
  if (['Em revisão', 'Aguardando cliente'].includes(p.status) || p.escritorio === 'Feito pela IA') return { g: 'pronto', t: p.status === 'Aguardando cliente' ? 'Pronto · com o cliente' : 'Pronto · em revisão', c: 'ok' };
  if (p.status === 'Ajustes') return { g: 'andando', t: 'Em ajuste', c: 'warn' };
  if (p.quadro || p.escritorio === 'Foi para outra máquina') return { g: 'andando', t: 'Na ' + (p.quadroNome ? p.quadroNome.replace(/^quadro de /, 'máquina de ') : 'máquina'), c: 'info' };
  if (p.escritorio === 'Fazendo (IA)' || p.status === 'Fazendo') return { g: 'andando', t: 'Sendo feito', c: 'info' };
  if (p.escritorio === 'À mão (Flau)') return { g: 'andando', t: 'Com o escritório, à mão', c: 'info' };
  if (p.escritorio === 'Precisa da Direção') return { g: 'andando', t: 'Com a diretoria', c: 'warn' };
  return { g: 'andando', t: 'Na fila do escritório', c: '' };
}
function listaPedidos(){
  const q = MPQ.trim().toLowerCase();
  const l = (D.pedidos || []).filter(p => (MP === 'eu' ? p.por === D.nome : !MP || p.por === MP) && (!q || (p.clienteNome + ' ' + p.nome + ' ' + p.texto).toLowerCase().includes(q)));
  const item = p => { const s = situacao(p), k = diff(p.prazo), abre = D.cards.some(c => c.id === p.id);
    const corpo = `<span class="t">${esc(p.clienteNome)} · ${esc(p.nome)}</span>
      <span class="meta"><span class="chip ${s.c}">${esc(s.t)}</span><span class="chip">${esc(p.tipo || 'Pedido')}</span><span class="chip">Pedido ${esc(p.quando)}</span>${MP !== 'eu' ? `<span class="chip">por ${esc(p.por)}</span>` : ''}${s.g === 'andando' && p.prazo ? (k < 0 ? `<span class="chip red">Atrasado ${-k}d</span>` : `<span class="chip">Prazo ${fmt(p.prazo)}</span>`) : ''}${/À MÃO/.test(p.modo) ? '<span class="chip">À mão</span>' : ''}</span>
      ${p.texto ? `<span class="sub" style="font-size:13px">${esc(p.texto)}</span>` : ''}
      ${s.g === 'falta' && p.falta ? `<span class="sub" style="font-size:13px;color:var(--bad)">O escritório precisa: ${esc(p.falta)}</span>` : ''}`;
    const links = [p.quadro ? `<a class="btn" style="text-decoration:none" href="${esc(p.quadro)}" target="_blank" rel="noopener">Ver na máquina</a>` : '', s.g === 'pronto' && p.link ? `<a class="btn" style="text-decoration:none" href="${esc(p.link)}" target="_blank" rel="noopener">Abrir arquivo</a>` : ''].join('');
    return `<li class="item ${s.g === 'falta' ? 'late' : ''}"><span class="stripe"></span>
      ${abre ? `<button class="main" data-open="${p.id}">${corpo}</button>` : `<div class="main" style="cursor:default">${corpo}</div>`}
      <span class="act">${s.g === 'falta' && abre ? `<button class="btn primary" data-go="${p.id}">Completar pedido</button>` : links}</span></li>`; };
  const g = (titulo, k, vazio) => { const x = l.filter(p => situacao(p).g === k); return !x.length && !vazio ? '' : `<section class="group"><h2>${titulo} <span class="count">${x.length}</span></h2>${x.length ? `<ul class="rows">${x.map(item).join('')}</ul>` : `<p class="empty">${vazio}</p>`}</section>`; };
  if (!l.length) return `<p class="empty">${MP === 'eu' ? 'Você ainda não mandou nenhum pedido ao escritório pelo painel.' : 'Nenhum pedido encontrado.'}</p>`;
  return g('Falta informação', 'falta', '') + g('Em andamento', 'andando', 'Nada em andamento.') + g('Prontos', 'pronto', 'Nada pronto ainda.') + g('Cancelados', 'cancelado', '');
}

function atualizarPedido(){

// Envio direto ao Drive em partes de 32 MB (mesmo jeito do portal do cliente). Devolve o link do arquivo.
function putParte(url, f, ini, fim, total){
  return new Promise((ok, erro) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.setRequestHeader('Content-Range', 'bytes ' + ini + '-' + (fim - 1) + '/' + total);
    x.upload.onprogress = e => { if (e.lengthComputable) progresso(ini + e.loaded, total); };
    x.onload = () => ok(x);
    x.onerror = () => erro(new Error('rede'));
    x.send(f.slice(ini, fim));
  });
}
function progresso(feito, total){ const p = Math.min(100, Math.round(feito / total * 100)); $('#up').hidden = false; $('#up-bar').style.width = p + '%'; $('#up-txt').textContent = 'Enviando… ' + p + '%'; }
// alvo: { card } para entrega, ou { modo: 'pedido', cliente } para anexo de pedido ao escritório.
async function enviar(alvo, f){
  const ini = await api('euforia-painel-arquivo', { ...alvo, etapa: 'iniciar', nome: f.name, tipo: f.type || 'application/octet-stream', tamanho: f.size });
  if (!ini || !ini.ok) throw new Error((ini && ini.motivo) || 'drive');
  if (DEMO) return ini.link;
  const PARTE = 32 * 1024 * 1024; let pos = 0, fim = null;
  progresso(0, 1);
  while (pos < f.size) {
    const ate = Math.min(pos + PARTE, f.size);
    let x, tent = 0;
    while (true) {
      try { x = await putParte(ini.url, f, pos, ate, f.size); if (x.status >= 500) throw new Error('5xx'); break; }
      catch (e) { if (++tent > 4) throw new Error('rede'); await new Promise(r => setTimeout(r, 2000 * tent)); }
    }
    if (x.status === 308) { const rg = x.getResponseHeader('Range'); pos = rg ? Number(rg.split('-')[1]) + 1 : ate; }
    else if (x.status === 200 || x.status === 201) { fim = JSON.parse(x.responseText); pos = f.size; }
    else throw new Error('drive');
  }
  $('#up-txt').textContent = 'Conferindo…';
  const pronto = await api('euforia-painel-arquivo', { ...alvo, etapa: 'pronto', arquivo: fim && fim.id });
  if (!pronto || !pronto.ok) throw new Error('drive');
  $('#up-txt').textContent = 'Arquivo no Drive.';
  return pronto.link;
}
