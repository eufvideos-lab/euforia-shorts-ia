<html><head><link rel="stylesheet" href="base.css"><style>
body{width:1280px;height:720px;position:relative;overflow:hidden;background:linear-gradient(100deg,var(--bege) 0%,#FBF6EE 60%,var(--bege) 100%)}
.side{position:absolute;left:0;top:0;width:470px;height:720px;background:var(--bordo)}
.photo{position:absolute;left:30px;bottom:0;height:700px}
.txt{position:absolute;left:560px;right:60px;top:0;height:720px;display:flex;flex-direction:column;justify-content:center;color:var(--tinta)}
.tag{align-self:flex-start;background:var(--bordo);color:var(--bege);font-size:22px;font-weight:700;letter-spacing:.24em;padding:12px 20px}
h1{font-family:'Cormorant Garamond';font-weight:700;font-size:100px;line-height:1;margin-top:28px;color:var(--bordoe)}
h1 em{font-style:italic;color:var(--dourado)}
.x{font-family:'Montserrat';font-weight:600;font-size:30px;margin-top:30px;color:var(--tinta);letter-spacing:.02em}
.x b{color:var(--bordo);border-bottom:4px solid var(--dourado)}
</style></head><body>
<div class="side"></div><img class="photo" src="busto-3.png">
<div class="txt"><div class="tag">ERRO COMUM</div>
<h1>Conflito se resolve <em>com afeto?</em></h1>
<div class="x">Pare de acreditar <b>nisso.</b></div></div></body></html>
