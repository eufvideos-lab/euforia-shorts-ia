<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>O Pacote da Semana · Treinamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--preto:#050505;--off:#F2EFEA;--laranja:#FF6518;--brasa:#C2410C;--cinza:#6b6660;--linha:#d9d4cc;--ok:#1f7a45;--erro:#b3261e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--off);color:var(--preto);overflow:hidden}
h1,h2,h3,.t{font-family:Archivo,Inter,sans-serif;font-weight:900;line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
.deck{height:100dvh;position:relative}
.slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:clamp(24px,6vw,96px);padding-bottom:clamp(84px,12vh,120px);overflow-y:auto}
.slide.on{display:flex}
.slide.dark{background:var(--preto);color:var(--off)}
.slide.fire{background:var(--laranja);color:var(--preto)}
.eyebrow{font-family:Archivo;font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:clamp(13px,1.3vw,18px);color:var(--brasa);margin-bottom:clamp(14px,2.4vh,28px)}
.dark .eyebrow{color:var(--laranja)} .fire .eyebrow{color:var(--preto)}
h1{font-size:clamp(44px,8.6vw,136px);text-transform:uppercase}
h2{font-size:clamp(34px,5.6vw,88px);text-transform:uppercase}
h2 em,h1 em{font-style:normal;color:var(--laranja)} .fire h2 em{color:var(--off)}
p.lead{font-size:clamp(20px,2.4vw,36px);line-height:1.3;margin-top:clamp(18px,3vh,36px);max-width:26ch;font-weight:500;max-width:34em}
.muted{color:var(--cinza)} .dark .muted{color:#a8a299}
.logo{height:clamp(28px,4vh,44px);position:absolute;top:clamp(20px,4vh,40px);left:clamp(24px,6vw,96px)}
.dark .logo,.fire .logo{display:none}
.grid{display:grid;gap:clamp(12px,1.6vw,24px);margin-top:clamp(22px,4vh,48px)}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:2px solid var(--preto);border-radius:18px;padding:clamp(16px,2vw,30px)}
.dark .card{background:#141312;border-color:#2c2a27}
.card .n{font-family:Archivo;font-weight:900;font-size:clamp(28px,3.4vw,52px);color:var(--laranja);line-height:1}
.card h3{font-size:clamp(20px,2.1vw,32px);text-transform:uppercase;margin:8px 0 6px}
.card p{font-size:clamp(16px,1.5vw,22px);line-height:1.35}
.tl{margin-top:clamp(20px,3.6vh,44px);display:grid;gap:clamp(10px,1.6vh,18px);max-width:1100px}
.tl div{display:grid;grid-template-columns:clamp(86px,10vw,150px) 1fr;gap:18px;align-items:baseline;font-size:clamp(18px,2vw,30px);line-height:1.25}
.tl b{font-family:Archivo;font-weight:900;color:var(--laranja)}
.tl .fim{font-weight:700}
.quote{font-family:Archivo;font-weight:800;font-size:clamp(26px,3.6vw,56px);line-height:1.1;margin-top:clamp(20px,4vh,44px);border-left:8px solid var(--laranja);padding-left:clamp(16px,2vw,32px);max-width:22em}
.pill{display:inline-block;border:2px solid currentColor;border-radius:999px;padding:6px 16px;font-weight:700;font-size:clamp(14px,1.3vw,20px);margin:0 8px 8px 0}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:clamp(22px,4vh,48px)}
.week div{border:2px solid var(--preto);border-radius:16px;padding:clamp(12px,1.6vw,24px);background:#fff;min-height:clamp(120px,22vh,220px)}
.week .hot{background:var(--laranja)}
.week small{font-family:Archivo;font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:clamp(12px,1.1vw,16px)}
.week strong{display:block;font-family:Archivo;font-weight:900;text-transform:uppercase;font-size:clamp(18px,2vw,30px);line-height:1.05;margin-top:10px}
.week span{display:block;font-size:clamp(14px,1.3vw,19px);margin-top:8px;line-height:1.3}
/* quiz */
.q h2{font-size:clamp(26px,3.6vw,56px);text-transform:none;letter-spacing:-.01em;line-height:1.08;max-width:24em}
.opts{display:grid;gap:12px;margin-top:clamp(18px,3vh,36px);max-width:1100px}
.opt{font:inherit;text-align:left;background:#fff;border:2px solid var(--preto);border-radius:16px;padding:clamp(14px,1.6vw,24px) clamp(16px,2vw,28px);font-size:clamp(17px,1.8vw,27px);line-height:1.25;font-weight:600;cursor:pointer;display:flex;gap:16px;align-items:flex-start;color:var(--preto)}
.opt i{font-style:normal;font-family:Archivo;font-weight:900;color:var(--laranja);min-width:1.2em}
.opt:hover:not([disabled]){background:#fff3ea}
.opt.certa{background:#e3f4ea;border-color:var(--ok)} .opt.certa i{color:var(--ok)}
.opt.errada{background:#fbe6e4;border-color:var(--erro)} .opt.errada i{color:var(--erro)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;font-size:clamp(17px,1.8vw,27px);line-height:1.3;font-weight:600;max-width:40em;min-height:2.6em;visibility:hidden}
.fb.on{visibility:visible} .fb b{font-family:Archivo;font-weight:900;text-transform:uppercase}
.fb.ok b{color:var(--ok)} .fb.no b{color:var(--erro)}
.placar{font-family:Archivo;font-weight:900;font-size:clamp(90px,18vw,280px);line-height:.9;color:var(--laranja)}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;padding:14px clamp(16px,4vw,48px);z-index:5;pointer-events:none}
.nav>*{pointer-events:auto}
.bar{flex:1;height:6px;background:rgba(120,115,105,.35);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--laranja);width:0;transition:width .25s}
.btn{font-family:Archivo;font-weight:800;font-size:18px;border:2px solid var(--off);background:var(--preto);color:var(--off);border-radius:999px;min-width:54px;height:54px;padding:0 20px;cursor:pointer}
.btn.sec{background:var(--off);color:var(--preto);border-color:var(--preto)}
.cont{font-family:Archivo;font-weight:800;font-size:15px;min-width:64px;text-align:center;background:var(--off);color:var(--preto);border-radius:999px;padding:6px 10px}
@media (max-width:820px){.g2,.g3,.g4,.week{grid-template-columns:1fr}.week div{min-height:0}.slide{justify-content:flex-start;padding-top:84px}.tl div{grid-template-columns:1fr;gap:2px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="nav">
  <button class="btn sec" id="ant" aria-label="Voltar">←</button>
  <div class="bar"><i id="prog"></i></div>
  <span class="cont" id="cont"></span>
  <button class="btn" id="prox" aria-label="Avançar">→</button>
</div>

const els = [...deck.children]; let at = 0;
function ir(n) { at = Math.max(0, Math.min(els.length - 1, n)); els.forEach((e, i) => e.classList.toggle('on', i === at));
  document.getElementById('prog').style.width = (100 * at / (els.length - 1)) + '%';
  document.getElementById('cont').textContent = (at + 1) + '/' + els.length;
  if (els[at].querySelector('#placar')) { document.getElementById('placar').textContent = acertos + '/' + Q.length;
    const f = Object.keys(resp).length;
    document.getElementById('placarTxt').textContent = f < Q.length ? 'Você pulou ' + (Q.length - f) + ' situação(ões). Volte e responda.' : acertos === Q.length ? 'Você já pensa como dono. Agora é fazer igual na segunda-feira.' : acertos >= 7 ? 'Quase lá. Reveja as que errou: cada uma delas já custou caro aqui.' : 'Vale refazer com calma. Cada situação dessas já aconteceu de verdade.'; }
  try { history.replaceState(null, '', '#' + (at + 1)); } catch (e) {} }
deck.addEventListener('click', e => { const b = e.target.closest('.opt'); if (!b || b.disabled) return;
  const i = +b.dataset.q, k = +b.dataset.k, certa = Q[i][2]; if (resp[i] !== undefined) return; resp[i] = k;
  const bs = els[at].querySelectorAll('.opt'); bs.forEach((x, j) => { x.disabled = true; if (j === certa) x.classList.add('certa'); else if (j === k) x.classList.add('errada'); });
  const ok = k === certa; if (ok) acertos++;
  const fb = document.getElementById('fb' + i); fb.className = 'fb on ' + (ok ? 'ok' : 'no'); fb.innerHTML = '<b>' + (ok ? 'Isso. ' : 'Não. ') + '</b>' + Q[i][3]; });
document.getElementById('prox').onclick = () => ir(at + 1);
document.getElementById('ant').onclick = () => ir(at - 1);
document.addEventListener('keydown', e => { if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); ir(at + 1); } if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); ir(at - 1); } });
ir((parseInt(location.hash.slice(1)) || 1) - 1);
