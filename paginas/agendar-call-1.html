<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Agendar Reunião de Onboarding · Grupo Euforia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{--fundo:#0B0B0F;--cartao:#15151C;--linha:rgba(255,255,255,.10);--texto:#F4F4F6;--suave:#A3A3AE;--destaque:#F5B301;--destaque-texto:#111;--erro:#FF7A7A;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--fundo);color:var(--texto);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-left,0px)) 64px}
  .marca{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--destaque)}
  h1{font-size:clamp(26px,6vw,34px);line-height:1.15;letter-spacing:-.02em;margin:10px 0 12px;text-wrap:balance}
  p{margin:0 0 12px;color:var(--suave)}
  .cartao{background:var(--cartao);border:1px solid var(--linha);border-radius:16px;padding:20px;margin-top:20px}
  .dia{margin-bottom:18px}
  .dia h2{font-size:15px;font-weight:600;margin:0 0 10px;text-transform:capitalize;color:var(--texto)}
  .horas{display:flex;flex-wrap:wrap;gap:8px}
  .hora{font:inherit;font-weight:600;font-size:15px;padding:10px 16px;border-radius:999px;border:1px solid var(--linha);background:transparent;color:var(--texto);cursor:pointer;min-width:84px}
  .hora:hover{border-color:var(--destaque)}
  .hora[aria-pressed="true"]{background:var(--destaque);color:var(--destaque-texto);border-color:var(--destaque)}
  label{display:block;font-size:14px;font-weight:600;margin:4px 0 8px;color:var(--texto)}
  input[type=email]{width:100%;font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--linha);background:#0F0F14;color:var(--texto)}
  .btn{display:block;width:100%;margin-top:16px;font:inherit;font-weight:700;font-size:16px;padding:15px;border-radius:999px;border:0;background:var(--destaque);color:var(--destaque-texto);cursor:pointer}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .nota{font-size:14px;color:var(--suave);margin-top:14px}
  .erro{color:var(--erro)}
  .ok h1{color:var(--destaque)}
  .escondido{display:none}
  .carregando{color:var(--suave)}
  .robo{position:absolute;left:-9999px}
</style>
</head>
<body>
<main class="wrap">
  <div class="marca">Grupo Euforia</div>
  <section id="tela">
    <h1 id="titulo">Agende a sua Reunião de Onboarding + Oferta</h1>
    <p id="intro" class="carregando">Carregando os horários disponíveis…</p>
  </section>
</main>
<script>
(function () {
  var BASE = 'https://n8n.grupoeuforia.tech/webhook/';
  var c = new URLSearchParams(location.search).get('c') || '';
  var tela = document.getElementById('tela');
  var escolhido = null;

  function esc(s) { return String(s || '').replace(/[&<>"']/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }
  function aviso(titulo, texto, classe) {
    tela.innerHTML = '<h1>' + esc(titulo) + '</h1><p class="' + (classe || '') + '">' + texto + '</p>';
  }
  var GRUPO = 'Se precisar de algo antes disso, é só chamar a equipe no grupo do WhatsApp.';
  function motivo(r) {
    if (r.motivo === 'sem-call') return aviso('Tudo certo, ' + esc(r.nome) + '!', 'O seu plano não tem essa reunião. A equipe segue com você pelo grupo do WhatsApp.');
    if (r.motivo === 'ja-marcada') return aviso('Sua reunião já está marcada', 'Ela está agendada para ' + esc(r.quando) + '. Para mudar o horário, fale com a equipe no grupo do WhatsApp.');
    if (r.motivo === 'ocupado') return aviso('Esse horário acabou de ser ocupado', 'Escolha outro horário. <a href="" style="color:inherit">Atualizar horários</a>');
    if (r.motivo === 'horario') return aviso('Esse horário não está mais disponível', 'Escolha outro horário. <a href="" style="color:inherit">Atualizar horários</a>');
    if (r.motivo === 'link') return aviso('Link inválido', 'Não encontramos o seu cadastro por este link. Peça o link certo à equipe no grupo do WhatsApp.', 'erro');
    return aviso('Não consegui carregar a agenda', 'Tente de novo em alguns minutos. ' + GRUPO, 'erro');
  }

  function montar(r) {
    if (!r.dias || !r.dias.length) return aviso('Sem horários livres agora', 'Não há horários livres nos próximos dias. ' + GRUPO);
    var h = '<h1>Olá, ' + esc(r.nome) + '! Agende a sua Reunião de Onboarding + Oferta</h1>' +
      '<p>É a nossa reunião de onboarding e oferta, com 1h30 de duração, por Google Meet. Escolha o melhor horário (horário de Brasília/Recife).</p>' +
      '<p>Dá para marcar a partir de 3 horas de agora, inclusive hoje. ' + GRUPO + '</p>' +
      '<div class="cartao">';
    r.dias.forEach(function (d) {
      h += '<div class="dia"><h2>' + esc(d.rotulo) + '</h2><div class="horas">';
      d.horarios.forEach(function (x) {
        h += '<button type="button" class="hora" aria-pressed="false" data-inicio="' + esc(x.inicio) + '" data-rotulo="' + esc(d.rotulo + ' às ' + x.hora) + '">' + esc(x.hora) + '</button>';
      });
      h += '</div></div>';
    });
    h += '<label for="email">Seu e-mail para o convite (opcional, se for outro além do e-mail do contrato)</label>' +
      '<input id="email" type="email" autocomplete="email" placeholder="voce@email.com">' +
      '<input class="robo" id="site_url" tabindex="-1" autocomplete="off" aria-hidden="true">' +
      '<button class="btn" id="marcar" disabled>Escolha um horário</button>' +
      '<p class="nota" id="status"></p></div>';
    tela.innerHTML = h;
    var botao = document.getElementById('marcar');
    tela.querySelectorAll('.hora').forEach(function (b) {
      b.addEventListener('click', function () {
        tela.querySelectorAll('.hora').forEach(function (o) { o.setAttribute('aria-pressed', 'false'); });
        b.setAttribute('aria-pressed', 'true');
        escolhido = b;
        botao.disabled = false;
        botao.textContent = 'Confirmar ' + b.getAttribute('data-rotulo');
      });
    });
    botao.addEventListener('click', marcar);
  }

  function marcar() {
    if (!escolhido) return;
    var botao = document.getElementById('marcar');
    botao.disabled = true;
    botao.textContent = 'Marcando…';
    fetch(BASE + 'euforia-call1-marcar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ c: c, inicio: escolhido.getAttribute('data-inicio'), email: document.getElementById('email').value, site_url: document.getElementById('site_url').value })
    }).then(function (x) { return x.json(); }).then(function (r) {
      if (!r.ok) return motivo(r);
      tela.classList.add('ok');
      aviso('Reunião marcada!', 'Está agendada para <strong>' + esc(r.quando) + '</strong>, por Google Meet' +
        (r.meet ? ' (<a href="' + esc(r.meet) + '" style="color:inherit">link da reunião</a>)' : '') +
        '. O convite chega no seu e-mail.');
    }).catch(function () { motivo({}); });
  }

  if (!/^[0-9a-fA-F-]{32,36}$/.test(c)) return motivo({ motivo: 'link' });
  fetch(BASE + 'euforia-call1-horarios?c=' + encodeURIComponent(c))
    .then(function (x) { return x.json(); })
    .then(function (r) { r.ok ? montar(r) : motivo(r); })
    .catch(function () { motivo({}); });
})();
</script>
</body>
</html>
